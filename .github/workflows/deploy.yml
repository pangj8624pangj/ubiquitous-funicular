name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/build-pulseops-platform-7G9QL

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VITE_API_URL must be set as a GitHub repository secret.
      # Value: the URL of your deployed Render API, e.g.:
      #   https://pulseops-api.onrender.com
      # Without it the frontend builds but cannot reach the API.
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # GitHub Pages serves 404.html for unknown routes — copy index.html
      # so React Router can handle all client-side paths on hard refresh.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
