# render.yaml — deploy the PulseOps API to Render.com
#
# One-time setup:
#   1. Go to https://dashboard.render.com → New → Blueprint
#   2. Connect this GitHub repo — Render reads this file automatically
#   3. After the service is created, open its Environment tab and set:
#        FRONTEND_URL  →  https://<your-github-username>.github.io
#   4. Copy the deployed service URL (e.g. https://pulseops-api.onrender.com)
#   5. Add it as a GitHub secret:  VITE_API_URL = https://pulseops-api.onrender.com
#   6. Push any commit to trigger a GitHub Pages rebuild with the correct API URL
#
# Notes:
#   • JWT_SECRET is auto-generated by Render (generateValue: true) — no action needed.
#   • The free tier uses an ephemeral filesystem, so the SQLite DB resets on each
#     deploy. Upgrade to a Render Persistent Disk or swap db.ts for a Postgres
#     adapter (pg / Prisma) for durable storage.

services:
  - type: web
    name: pulseops-api
    runtime: node
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true          # Render generates a secure random value
      - key: FRONTEND_URL
        sync: false                  # Set manually: https://<you>.github.io
      # Optional — add after registering an Intercom OAuth app:
      # - key: INTERCOM_CLIENT_ID
      #   sync: false
      # - key: INTERCOM_CLIENT_SECRET
      #   sync: false
      # - key: INTERCOM_WEBHOOK_SECRET
      #   sync: false
